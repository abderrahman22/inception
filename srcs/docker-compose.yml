services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
    restart: on-failure

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    env_file:
      - .env
    depends_on:
      - mariadb
    volumes:
      - wp_data:/var/www/wordpress
    networks:
      - inception
    restart: on-failure

  # nginx:
  #   build: ./requirements/nginx
  #   container_name: nginx
  #   env_file:
  #     - .env
  #   depends_on:
  #     - wordpress
  #   ports:
  #     - "443:443"
  #   volumes:
  #     - wp_data:/var/www/wordpress
  #   networks:
  #     - inception
  #   restart: on-failure

networks:
  inception:
    driver: bridge

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/inception/data/db_data
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/inception/data/wp_data
version: '3'

services:
  mariadb:
    image : mariadb:maria
    build: ./requirements/mariadb
    container_name: mariadb
    restart: always
    env_file: .env
    volumes:
      - db-volume:/var/lib/mysql
    networks:
      - inception

  wordpress:
    image : wordpress:wordpress
    build: ./requirements/wordpress
    container_name: wordpress
    restart: always
    env_file: .env
    volumes:
      - wp-volume:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb

  nginx:
    image : nginx:nginx
    build: ./requirements/nginx
    container_name: nginx
    restart: always
    ports:
      - "443:443"
    volumes:
      - wp-volume:/var/www/html
    networks:
      - inception
    depends_on:
      - wordpress

networks:
  inception:
    driver: bridge

volumes:
  db-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/inception/data/mariadb
  wp-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/inception/data/wordpress